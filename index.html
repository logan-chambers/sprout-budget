    --sun-soft: #fff3d6;

    --mint-soft: #dcf5ec;
    --sky: #5b9bff;
    --sky-soft: #e2ecff;
    --lav: #9b8cff;
    --lav-soft: #ece7ff;
    --ink: #2c2740;
    --ink-dim: #837c99;
    --line: #f0e9db;
    --danger: #ff5c5c;

  html, body { margin: 0; background: var(--cream); font-family: 'Inter', sans-serif; color: var(--ink); }
  h1, h2, h3, .display { font-family: 'Baloo 2', sans-serif; }

  #app { display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 2px solid var(--line);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #brand { display: flex; align-items: center; gap: 8px; font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; margin-bottom: 22px; padding: 0 8px; }
  #brand .leaf { font-size: 26px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 14px; cursor: pointer;
    font-weight: 600; font-size: 14.5px; color: var(--ink-dim);
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--cream); }
  .nav-item.active { background: var(--coral); color: white; }
  .nav-item .ic { font-size: 17px; }

  #main { flex: 1; padding: 30px 36px; max-width: 1180px; }
  .page-title { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
  .page-sub { color: var(--ink-dim); margin: 0 0 22px; font-size: 14px; }

  .grid { display: grid; gap: 18px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 1000px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border-radius: 22px;
    padding: 22px;
    border: 2px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; }

  .hero-networth {
    background: linear-gradient(135deg, var(--coral), var(--sun));
    color: white;
    border: none;
  }
  .hero-networth .blob {
    position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255,255,255,0.12); top: -80px; right: -60px;
  }
  .hero-networth .label { font-size: 13px; opacity: 0.9; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .hero-networth .amount { font-family: 'Baloo 2'; font-size: 42px; font-weight: 800; margin: 6px 0 2px; }
  .hero-networth .delta { font-size: 13px; font-weight: 600; opacity: 0.95; }

  .stat-card .label { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .stat-card .val { font-family: 'Baloo 2'; font-size: 26px; font-weight: 800; margin-top: 6px; }
  .stat-card .sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }

  .account-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .account-row:last-child { border-bottom: none; }
  .acc-left { display: flex; align-items: center; gap: 10px; }
  .acc-badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .acc-name { font-weight: 700; font-size: 13.5px; }
  .acc-type { font-size: 11.5px; color: var(--ink-dim); }
  .acc-bal { font-weight: 700; font-family: 'Baloo 2'; font-size: 15px; }
  .acc-bal.neg { color: var(--danger); }

  .btn {
    background: var(--coral); color: white; border: none; border-radius: 12px;
    padding: 10px 18px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    font-family: 'Inter'; display: inline-flex; align-items: center; gap: 6px;

  .btn:hover { opacity: 0.92; }
  .btn.ghost { background: var(--cream); color: var(--ink); border: 2px solid var(--line); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    font-family: 'Inter'; border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; background: white;

  .amt-pos { color: var(--mint); font-weight: 700; }

  .budget-bar-track { background: var(--cream); border-radius: 999px; height: 12px; overflow: hidden; }
  .budget-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }
  .budget-nums { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-dim); }
  .budget-edit { border: none; background: transparent; color: var(--ink-dim); cursor: pointer; font-size: 12px; text-decoration: underline; }

  .recur-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .recur-row:last-child { border-bottom: none; }
  .recur-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; }

  .recur-amt { font-family: 'Baloo 2'; font-weight: 800; font-size: 15px; }

    position: fixed; inset: 0; background: rgba(44,39,64,0.35); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; border-radius: 22px; padding: 26px; width: 380px; max-width: 90vw;
    border: 2px solid var(--line);
  }
  .modal h3 { margin-top: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); font-family: 'Inter'; font-size: 13.5px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }

  .chart-wrap { position: relative; height: 260px; }
  .empty { color: var(--ink-dim); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>

// ---------------- Helpers ----------------
const fmt = (n) => (n < 0 ? "-$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                          : "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtShort = (n) => "$" + Math.round(n).toLocaleString();

function currentMonthKey() { return "2026-08"; }
function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }

function spendingByCategory(monthKey) {
  const out = {};
  CATEGORIES.forEach(c => out[c.id] = 0);
  TRANSACTIONS.filter(t => monthKeyOf(t.date) === monthKey && t.amount < 0).forEach(t => {
    out[t.category] = (out[t.category] || 0) + Math.abs(t.amount);
  });
  return out;
}

function totalNetWorth() {
  return ACCOUNTS.reduce((s, a) => s + a.balance, 0);
}

function detectRecurring() {
  const byMerchant = {};
  TRANSACTIONS.filter(t => t.amount < 0).forEach(t => {
    byMerchant[t.merchant] = byMerchant[t.merchant] || [];
    byMerchant[t.merchant].push(t);
  });
  const recurring = [];
  Object.entries(byMerchant).forEach(([merchant, txs]) => {
    const months = new Set(txs.map(t => monthKeyOf(t.date)));
    if (months.size >= 2) {
      const avg = txs.reduce((s, t) => s + Math.abs(t.amount), 0) / txs.length;
      const last = txs.sort((a, b) => b.date.localeCompare(a.date))[0];
      recurring.push({ merchant, category: last.category, avg, count: txs.length, lastDate: last.date });
    }
  });
  return recurring.sort((a, b) => b.avg - a.avg);
}

            <div class="acc-bal ${a.balance < 0 ? "neg" : ""}">${fmt(a.balance)}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="card" style="margin-top:18px;">
      <h3>🧾 Recent transactions</h3>
      ${txTableHTML(recent)}
    </div>
  `;
}

function catPill(catId) {
  const c = catById[catId];
  return `<span class="cat-pill" style="background:${c.soft};color:${c.color}">${c.emoji} ${c.name}</span>`;
}

function txTableHTML(list) {
  if (list.length === 0) return `<div class="empty">No transactions found.</div>`;
  return `
    <table class="tx-table">
      <thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Account</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>
        ${list.map(t => `
          <tr>
            <td>${t.date}</td>
            <td>${t.merchant}</td>
            <td>${catPill(t.category)}</td>
            <td>${ACCOUNTS.find(a => a.id === t.account)?.name || ""}</td>
            <td style="text-align:right" class="${t.amount >= 0 ? "amt-pos" : "amt-neg"}">${t.amount >= 0 ? "+" : ""}${fmt(t.amount)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

let txFilterCategory = "all";
let txSearch = "";

function pageTransactions() {
  let list = [...TRANSACTIONS].sort((a, b) => b.date.localeCompare(a.date));
  if (txFilterCategory !== "all") list = list.filter(t => t.category === txFilterCategory);
  if (txSearch.trim()) list = list.filter(t => t.merchant.toLowerCase().includes(txSearch.toLowerCase()));

  return `
    <h1 class="page-title">Transactions</h1>
    <p class="page-sub">${TRANSACTIONS.length} total transactions across all accounts.</p>
    <div class="card">
      <div class="toolbar">
        <input id="tx-search" placeholder="Search merchant..." value="${txSearch}" />
        <select id="tx-filter">
          <option value="all">All categories</option>
          ${CATEGORIES.map(c => `<option value="${c.id}" ${txFilterCategory === c.id ? "selected" : ""}>${c.emoji} ${c.name}</option>`).join("")}
        </select>
        <button class="btn" id="add-tx-btn">+ Add transaction</button>
      </div>
      ${txTableHTML(list)}
    </div>
  `;
}

function pageBudgets() {
  const spend = spendingByCategory(currentMonthKey());
  const spendCats = CATEGORIES.filter(c => c.id !== "income");
  return `
    <h1 class="page-title">Budgets</h1>
    <p class="page-sub">How August is tracking against your monthly targets.</p>
    <div class="grid cols-3">
      ${spendCats.map(c => {
        const spent = spend[c.id] || 0;
        const pct = c.budget > 0 ? Math.min(100, (spent / c.budget) * 100) : 0;
        const over = spent > c.budget;
        const barColor = over ? "var(--danger)" : c.color;
        return `
          <div class="card budget-card" data-cat="${c.id}">
            <div class="cat-head">
              <div class="cat-name">${c.emoji} ${c.name}</div>
              <button class="budget-edit" data-editcat="${c.id}">edit</button>
            </div>
            <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%; background:${barColor}"></div></div>
            <div class="budget-nums">
              <span>${fmt(spent)} spent</span>
              <span>${over ? "over by " + fmt(spent - c.budget) : fmt(c.budget - spent) + " left"}</span>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function pageRecurring() {
  const recurring = detectRecurring();
  const totalMonthly = recurring.reduce((s, r) => s + r.avg, 0);
  return `
    <h1 class="page-title">Recurring</h1>
    <p class="page-sub">Detected from repeat merchants across your transaction history.</p>
    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="card stat-card"><div class="label">Recurring merchants</div><div class="val">${recurring.length}</div></div>
      <div class="card stat-card"><div class="label">Est. monthly total</div><div class="val">${fmtShort(totalMonthly)}</div></div>
      <div class="card stat-card"><div class="label">Largest</div><div class="val" style="font-size:18px;">${recurring[0]?.merchant || "—"}</div></div>
    </div>
    <div class="card">
      ${recurring.map(r => `
        <div class="recur-row">
          <div>
            <div class="recur-name">${catById[r.category].emoji} ${r.merchant}</div>
            <div class="recur-meta">${catById[r.category].name} · seen ${r.count}x · last on ${r.lastDate}</div>
          </div>
          <div class="recur-amt">${fmt(r.avg)}/mo</div>
        </div>
      `).join("")}
    </div>
  `;
}

function pageTrends() {
  return `
    <h1 class="page-title">Trends</h1>
    <p class="page-sub">Your net worth and spending, over time.</p>
    <div class="card" style="margin-bottom:18px;">
      <h3>📈 Net worth — last 6 months</h3>
      <div class="chart-wrap"><canvas id="chart-networth"></canvas></div>
    </div>
    <div class="card">
      <h3>📊 Spending by category — last 3 months</h3>
      <div class="chart-wrap"><canvas id="chart-spend-trend"></canvas></div>
    </div>
  `;
}

// ---------------- After-render wiring ----------------
function afterRender() {
  if (currentPage === "dashboard") {
    const spend = spendingByCategory(currentMonthKey());
    const spendCats = CATEGORIES.filter(c => c.id !== "income" && spend[c.id] > 0);
    charts.dashCat = new Chart(document.getElementById("chart-dash-cat"), {
      type: "doughnut",
      data: {
        labels: spendCats.map(c => c.name),
        datasets: [{ data: spendCats.map(c => spend[c.id]), backgroundColor: spendCats.map(c => c.color), borderWidth: 3, borderColor: "#fff" }]
      },
      options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { family: "Inter", size: 11 } } } } }
    });
  }

  if (currentPage === "transactions") {
    document.getElementById("tx-search").addEventListener("input", (e) => { txSearch = e.target.value; render(); });
    document.getElementById("tx-filter").addEventListener("change", (e) => { txFilterCategory = e.target.value; render(); });
    document.getElementById("add-tx-btn").addEventListener("click", openTxModal);
  }

  if (currentPage === "budgets") {
    document.querySelectorAll("[data-editcat]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.editcat;
        const cat = catById[id];
        const val = prompt(`New monthly budget for ${cat.name}:`, cat.budget);
        if (val !== null && !isNaN(parseFloat(val))) {
          cat.budget = parseFloat(val);
          render();
        }
      });
    });
  }

  if (currentPage === "trends") {
    charts.networth = new Chart(document.getElementById("chart-networth"), {
      type: "line",
      data: {
        labels: NET_WORTH_HISTORY.map(h => h.month),
        datasets: [{
          data: NET_WORTH_HISTORY.map(h => h.value),
          borderColor: "#ff7a6b", backgroundColor: "rgba(255,122,107,0.12)",
          fill: true, tension: 0.35, pointBackgroundColor: "#ff7a6b", pointRadius: 4
        }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => "$" + (v/1000) + "k" } } } }
    });

    const months = ["2026-06", "2026-07", "2026-08"];
    const spendCats = CATEGORIES.filter(c => c.id !== "income");
    charts.spendTrend = new Chart(document.getElementById("chart-spend-trend"), {
      type: "bar",
      data: {
        labels: months.map(m => ({ "2026-06": "June", "2026-07": "July", "2026-08": "August" }[m])),
        datasets: spendCats.map(c => ({
          label: c.name,
          data: months.map(m => spendingByCategory(m)[c.id] || 0),
          backgroundColor: c.color
        }))
      },
      options: {
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: v => "$" + v } } }
      }
    });
  }
}

// ---------------- Add transaction modal ----------------
function openTxModal() {
  const catSel = document.getElementById("f-category");
  catSel.innerHTML = CATEGORIES.filter(c => c.id !== "income").map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join("");
  const accSel = document.getElementById("f-account");
  accSel.innerHTML = ACCOUNTS.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
  document.getElementById("f-merchant").value = "";
  document.getElementById("f-amount").value = "";
  document.getElementById("f-date").value = "2026-08-12";
  document.getElementById("tx-modal-backdrop").classList.add("open");
}
document.getElementById("tx-cancel").addEventListener("click", () => document.getElementById("tx-modal-backdrop").classList.remove("open"));
document.getElementById("tx-save").addEventListener("click", () => {
  const merchant = document.getElementById("f-merchant").value.trim();
  const amount = parseFloat(document.getElementById("f-amount").value);
  const category = document.getElementById("f-category").value;
  const account = document.getElementById("f-account").value;
  const date = document.getElementById("f-date").value;
  if (!merchant || isNaN(amount) || !date) { alert("Please fill in merchant, amount, and date."); return; }
  TRANSACTIONS.push({ id: nextId++, date, merchant, amount, category, account });
  const acc = ACCOUNTS.find(a => a.id === account);
  if (acc) acc.balance += amount;
  document.getElementById("tx-modal-backdrop").classList.remove("open");
  render();
});

render();
</script>
</body>
</html>
